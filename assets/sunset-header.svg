<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="James V: sunset over the sea with an astronaut engineer peeking from behind a rock">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150a33"/>
      <stop offset="0.35" stop-color="#4b1763"/>
      <stop offset="0.7" stop-color="#c7347a"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.55" stop-color="#ff8f6b"/>
      <stop offset="1" stop-color="#ff3f8e"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1556"/>
      <stop offset="0.5" stop-color="#16395a"/>
      <stop offset="1" stop-color="#083b45"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1446"/>
      <stop offset="0.6" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#05303a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9fb8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9fb8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="franjas">
      <rect x="330" y="60" width="240" height="66"/>
      <rect x="330" y="130" width="240" height="7"/>
      <rect x="330" y="141" width="240" height="6"/>
      <rect x="330" y="151" width="240" height="5"/>
      <rect x="330" y="160" width="240" height="4"/>
      <rect x="330" y="167" width="240" height="3"/>
    </clipPath>
    <clipPath id="recorte-visor">
      <ellipse cx="806" cy="172" rx="27" ry="21"/>
    </clipPath>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="suave"><feGaussianBlur stdDeviation="1"/></filter>

    <!-- Una hoja de palmera, desde el origen hacia la derecha. -->
    <path id="hoja" d="M0 0 C18 -16 44 -14 66 4 C52 -2 40 0 30 4 C22 0 12 0 0 0 Z"/>
    <!-- Palmera con la base en el origen. -->
    <g id="palmera">
      <path d="M0 0 C-4 -40 -2 -90 14 -128" fill="none" stroke="#1b0828" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(14 -128)" fill="#1b0828">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="6s" repeatCount="indefinite"/>
          <use href="#hoja" transform="rotate(-10)"/>
          <use href="#hoja" transform="rotate(30)"/>
          <use href="#hoja" transform="rotate(-45)"/>
          <use href="#hoja" transform="scale(-1 1) rotate(-10)"/>
          <use href="#hoja" transform="scale(-1 1) rotate(30)"/>
          <use href="#hoja" transform="scale(-1 1) rotate(-45)"/>
          <use href="#hoja" transform="rotate(-80) scale(0.8)"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- Cielo y estrellas -->
  <rect width="900" height="260" fill="url(#cielo)"/>
  <g fill="#fff">
    <circle cx="610" cy="28" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="52" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="22" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1"/>
    <circle cx="540" cy="44" r="0.9"/>
    <circle cx="330" cy="30" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="18" r="0.9"/>
  </g>

  <!-- Sol a franjas -->
  <circle cx="450" cy="170" r="130" fill="url(#halo)"/>
  <circle cx="450" cy="170" r="92" fill="url(#sol)" clip-path="url(#franjas)"/>

  <!-- Islas lejanas -->
  <path d="M520 170 C545 156 565 150 590 158 C610 150 635 152 660 170 Z" fill="#5a1d5e" opacity="0.85"/>
  <path d="M230 170 C250 160 275 158 300 170 Z" fill="#5a1d5e" opacity="0.7"/>

  <!-- Mar con reflejo y cuadrícula -->
  <rect y="170" width="900" height="90" fill="url(#mar)"/>
  <g fill="#ffb27a">
    <rect x="392" y="176" width="116" height="3" rx="1.5" opacity="0.8"><animate attributeName="width" values="116;100;116" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="404" y="186" width="92" height="3" rx="1.5" opacity="0.6"/>
    <rect x="416" y="197" width="68" height="2.5" rx="1.2" opacity="0.45"><animate attributeName="x" values="416;424;416" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="428" y="209" width="44" height="2" rx="1" opacity="0.3"/>
  </g>
  <g stroke="#3ee6d4" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path d="M0 192 H900 M0 214 H900 M0 240 H900"/>
    <path d="M450 170 L-150 260 M450 170 L60 260 M450 170 L250 260 M450 170 L450 260 M450 170 L650 260 M450 170 L840 260 M450 170 L1050 260"/>
  </g>

  <!-- Palmeras -->
  <use href="#palmera" transform="translate(196 262)"/>
  <use href="#palmera" transform="translate(250 262) scale(-0.78 0.78)"/>
  <use href="#palmera" transform="translate(132 262) scale(0.62)"/>

  <!-- Astronauta ingeniero asomándose -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 0;0 0;0 6" keyTimes="0;0.2;0.85;1" dur="7s" repeatCount="indefinite"/>
    <!-- antena con luz -->
    <path d="M784 140 L774 112" stroke="#cfd6e0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="773" cy="110" r="4" fill="#3ee6d4">
      <animate attributeName="fill" values="#3ee6d4;#ff4f8b;#3ee6d4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- casco -->
    <circle cx="806" cy="175" r="44" fill="#eef1f6"/>
    <path d="M770 200 A44 44 0 0 0 846 196" fill="#c3c9d6"/>
    <circle cx="840" cy="160" r="6" fill="#ff8a5b"/>
    <ellipse cx="806" cy="172" rx="29" ry="23" fill="#8d95a8"/>
    <ellipse cx="806" cy="172" rx="27" ry="21" fill="url(#visor)"/>
    <!-- reflejo del atardecer en el visor -->
    <g clip-path="url(#recorte-visor)">
      <circle cx="794" cy="176" r="10" fill="#ff8f6b" opacity="0.85"/>
      <rect x="778" y="176" width="40" height="1.6" fill="#0d1b2e"/>
      <rect x="778" y="180" width="40" height="1.4" fill="#0d1b2e"/>
      <path d="M786 158 C792 153 801 152 808 154" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
  </g>

  <!-- Roca -->
  <path d="M720 262 C726 236 738 214 760 206 C780 198 812 202 836 196 C858 190 884 196 900 206 L900 262 Z" fill="#1b0828"/>
  <path d="M760 206 C780 198 812 202 836 196" stroke="#ff8a5b" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

  <!-- Guante sobre la roca, con llave -->
  <g>
    <path d="M846 194 L878 168" stroke="#9aa3b5" stroke-width="5" stroke-linecap="round"/>
    <path d="M872 164 a8 8 0 1 0 12 9 l-5 -2 l-1 -5 z" fill="#9aa3b5"/>
    <rect x="834" y="186" width="26" height="16" rx="7" fill="#eef1f6"/>
    <path d="M838 192 H856 M838 197 H856" stroke="#c3c9d6" stroke-width="1.5"/>
    <rect x="770" y="196" width="24" height="14" rx="6" fill="#eef1f6"/>
    <path d="M776 200 V208 M782 200 V208 M788 200 V208" stroke="#c3c9d6" stroke-width="1.5"/>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI', 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="78" font-size="50" font-weight="800" font-style="italic" fill="#ffd6ec" filter="url(#neon)" letter-spacing="1">James V</text>
    <text x="42" y="106" font-size="16" font-weight="600" fill="#7ff3e6" letter-spacing="1.2">OPEN SOURCE BUG FIXER</text>
    <text x="42" y="128" font-size="14" fill="#ffe3d3" opacity="0.92">developer tools · AI agents · Honduras</text>
  </g>
</svg>
